services:
  postgres:
    image: postgres:16
    container_name: momentum_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
